{% extends "appelli/base.html" %}

{% block content %}
<div class="card shadow-sm">
    <div class="card-body">
        <h1 class="h4">Benvenuto/a, {{ user.get_username }}</h1>
        <p class="text-muted">
            Il tuo utente non appartiene al gruppo «studente» o «docente».
        </p>
        {% if user.is_staff %}
            <a class="btn btn-primary" href="{% url 'admin:index' %}">
                Vai all'area amministrativa
            </a>
        {% endif %}
    </div>
</div>
{% endblock %}
