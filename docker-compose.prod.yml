# Configurazione di PRODUZIONE per la macchina dell'università.
#
# Uso:  docker compose -f docker-compose.prod.yml up -d --build
#
# Differenze rispetto al file di sviluppo:
#  - il servizio 'web' NON espone porte sull'host: è raggiungibile solo
#    tramite Traefik, che gestisce HTTPS e l'autenticazione Shibboleth;
#  - Shibboleth attivo (SHIB_ENABLED=1) e DEBUG disattivato;
#  - 'web' è collegato alla rete condivisa 'proxy-net' su cui gira Traefik;
#  - le tesi caricate sono su un volume dedicato (persistono ai riavvii).

# Rete condivisa creata da Traefik: deve già esistere sulla macchina.
networks:
  proxy-net:
    external: true

services:
  db:
    image: mysql:8.4
    container_name: appelli_db
    restart: unless-stopped
    environment:
      # Valori presi dal file .env (o dall'ambiente) al momento di 'up'/'build',
      # così le credenziali non stanno in chiaro nel file versionato.
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-p$$MYSQL_ROOT_PASSWORD" ]
      interval: 5s
      timeout: 5s
      retries: 10
    # Il db resta sulla rete di default: lo raggiunge solo 'web', non Traefik.

  web:
    build: .
    container_name: appelli_web
    restart: unless-stopped
    # Con i default di gunicorn (1 worker "sync", timeout 30s) un upload che
    # richiede piu' di 30 secondi (video pesanti, connessione lenta) fa
    # scadere il worker A META' LETTURA: essendo l'unico, il sito resta fermo
    # per tutti finche' non riparte. --threads passa al worker "gthread", che
    # non ha questo problema; --timeout 300 lascia margine ai video piu'
    # pesanti. Va tenuto allineato al compose di sviluppo.
    command: sh -c "python manage.py migrate && python manage.py collectstatic --noinput && gunicorn thesis_submission.wsgi:application --bind 0.0.0.0:8000 --workers 2 --threads 4 --timeout 300"
    environment:
      DB_HOST: db
      # Stesse variabili del servizio 'db': restano allineate automaticamente.
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DJANGO_ALLOWED_HOSTS: "tesi.ing.unimore.it"
      DJANGO_DEBUG: "0"                # produzione: niente stack trace/debug
      SHIB_ENABLED: "1"               # attiva il middleware Shibboleth
      # Logout del SP Shibboleth (sta su services-host, non su tesi): chiude la
      # sessione Shibboleth e riporta all'autenticazione. Se cambia l'host del
      # SP o del sito, aggiorna qui.
      DJANGO_LOGOUT_REDIRECT_URL: "https://services-host.ing.unimore.it/Shibboleth.sso/Logout?return=https://tesi.ing.unimore.it/"
    volumes:
      - media_data:/app/media          # le tesi caricate persistono
    networks:
      - default                        # per raggiungere il container 'db'
      - proxy-net                      # per farsi raggiungere da Traefik
    depends_on:
      db:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      # --- Router PROTETTO (catch-all): tutto passa da Shibboleth ---
      - "traefik.http.routers.appelli.rule=Host(`tesi.ing.unimore.it`)"
      - "traefik.http.routers.appelli.entrypoints=websecure"
      - "traefik.http.routers.appelli.tls.certresolver=letsencrypt"
      - "traefik.http.routers.appelli.priority=1"
      - "traefik.http.routers.appelli.middlewares=shib-auth@file"
      - "traefik.http.services.appelli.loadbalancer.server.port=8000"
      # --- Router PUBBLICO: la home "/" e i file statici NON passano da
      #     Shibboleth, così la landing è visibile senza login. Priorità più
      #     alta del router protetto, così vince su questi percorsi. ---
      - "traefik.http.routers.appelli-pub.rule=Host(`tesi.ing.unimore.it`) && (Path(`/`) || PathPrefix(`/static/`))"
      - "traefik.http.routers.appelli-pub.entrypoints=websecure"
      - "traefik.http.routers.appelli-pub.tls.certresolver=letsencrypt"
      - "traefik.http.routers.appelli-pub.priority=100"
      - "traefik.http.routers.appelli-pub.service=appelli"
      # Con 'web' su più reti, indica a Traefik quale usare per raggiungerlo:
      - "traefik.docker.network=proxy-net"

volumes:
  db_data:
  media_data:
